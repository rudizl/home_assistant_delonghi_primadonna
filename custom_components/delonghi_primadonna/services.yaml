make_beverage:
  name: Prepare beverage
  description: Prepares beverages from the list of available beverages
  target:
    entity:
      integration: delonghi_primadonna
  fields:
    beverage:
      name: Beverage
      description: Beverage to prepare
      required: true
      example: "cappuccino"
      selector:
        select:
          translation_key: "beverage"
          options:
            - "espresso"
            - "coffee"
            - "long"
            - "espresso2"
            - "dopio"
            - "americano"
            - "cappuccino"
            - "latte_macchiato"
            - "caffe_latte"
            - "flat_white"
            - "espresso_macchiato"
            - "hot_milk"
            - "cappuccino_doppio"
            - "cold_milk"
            - "cappuccino_reverse"
            - "hot_water"
            - "steam"
            - "ciocco"
            - "ristretto"
            - "long_espresso"
            - "coffee_cream"
            - "tea"
            - "coffee_pot"
            - "cortado"
            - "long_black"
            - "travel_mug"
            - "brew_over_ice"
