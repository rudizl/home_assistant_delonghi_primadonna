name: Create Release

on:
  push:
    branches:
      - masterV0
    paths:
      - custom_components/delonghi_primadonna/manifest.json

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create release for a new manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r '.version' custom_components/delonghi_primadonna/manifest.json)
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists, nothing to do"
            exit 0
          fi
          gh release create "$version" --target "$GITHUB_SHA" \
            --title "Release $version" --generate-notes
